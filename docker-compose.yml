version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rjobs_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rjobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rjobs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rjobs_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rjobs -d rjobs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rjobs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: rjobs_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rjobs_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rjobs_minio_secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  latex_compiler:
    image: ghcr.io/tectonic-typesetting/tectonic:latest
    container_name: rjobs_latex_compiler
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

volumes:
  postgres_data:
  redis_data:
  minio_data:
